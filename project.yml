name: iOSAgent
options:
  bundleIdPrefix: com.sam
  deploymentTarget:
    iOS: "16.0"

settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"

targets:
  iOSAgent:
    type: application
    platform: iOS
    sources:
      - path: iOSAgent
    info:
      path: iOSAgent/Info.plist
      properties:
        CFBundleIdentifier: com.sam.iosagent
        CFBundleName: iOSAgent
        CFBundleExecutable: iOSAgent
        CFBundleVersion: "1.0"
        CFBundleShortVersionString: "1.0"
        MinimumOSVersion: "16.0"
        UIRequiredDeviceCapabilities: [arm64]
        NSLocationAlwaysAndWhenInUseUsageDescription: "Agent"
        NSLocationWhenInUseUsageDescription: "Agent"
        UIBackgroundModes: [fetch, remote-notification]
