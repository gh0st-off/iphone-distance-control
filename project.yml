name: iOSAgent
options:
  bundleIdPrefix: com.sam
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
targets:
  iOSAgent:
    type: tool          # <-- plus "application", mais "tool" = binary CLI
    platform: iOS
    sources:
      - path: iOSAgent
